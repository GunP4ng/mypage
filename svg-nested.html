<!doctype html>
<meta charset="utf-8">
<title>svg nested</title>
<script>
function beacon(kind, extra='') {
  new Image().src = 'https://webhook.site/09513229-f9de-4438-a2b6-12b86e5b4ca2/' + kind + '?extra=' + encodeURIComponent(extra) + '&t=' + Date.now();
}
window.addEventListener('load', () => {
  beacon('svgpage', 'boot');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><image href="https://webhook.site/09513229-f9de-4438-a2b6-12b86e5b4ca2/svginner?x=${Date.now()}" width="10" height="10"/></svg>`;
  const img = new Image();
  img.onload = () => beacon('svgload', 'ok');
  img.onerror = (e) => beacon('svgerr', 'err');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  document.body.appendChild(img);
});
</script>
